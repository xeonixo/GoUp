[changelog]
header = ""
# Only the subject line of each commit goes into the notes; bodies and trailers stay in git.
# Group names carry an HTML comment prefix to control their order; striptags removes it.
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}\n
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | upper_first }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/xeonixo/goup/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
  { message = "^[Ff]eat", group = "<!-- 0 -->Features" },
  { message = "^[Aa]dd", group = "<!-- 0 -->Features" },
  { message = "^[Ff]ix", group = "<!-- 1 -->Bug Fixes" },
  { message = "^[Pp]erf", group = "<!-- 2 -->Performance" },
  { message = "^[Rr]efactor", group = "<!-- 3 -->Refactoring" },
  { message = "^[Rr]efractor", group = "<!-- 3 -->Refactoring" },
  { message = "^([Uu]pdate|[Bb]ump) .*(dependenc|deps|toolchain)", group = "<!-- 5 -->Dependencies" },
  { message = "^[Dd]ocs", group = "<!-- 6 -->Documentation" },
  { message = "^[Cc]hore", skip = true },
  { message = "^[Cc]i", skip = true },
  { message = "^[Ss]tyle", skip = true },
  { message = "^[Tt]est", skip = true },
  { message = ".*", group = "<!-- 4 -->Changes" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
