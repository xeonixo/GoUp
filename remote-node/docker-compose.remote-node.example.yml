services:
  goup-remote-node:
    image: ghcr.io/xeonixo/goup:latest
    container_name: goup-remote-node
    environment:
      - GOUP_MODE=remote-node
      - REMOTE_NODE_CONTROL_PLANE_URL=https://your-goup.example.com
      - REMOTE_NODE_ID=rn_replace_me
      - REMOTE_NODE_BOOTSTRAP_KEY=replace_me
      - REMOTE_NODE_POLL_SECONDS=20
    # Drop every capability except NET_RAW (needed for ICMP monitors; the binary
    # carries cap_net_raw as a file capability).
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
    # NOTE: do not enable "no-new-privileges:true" while ICMP monitors are used:
    # it makes the kernel ignore file capabilities, so the non-root process would
    # lose NET_RAW. If you do not use ICMP monitors you can add:
    #   security_opt:
    #     - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    restart: unless-stopped
